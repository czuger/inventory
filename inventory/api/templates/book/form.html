{% extends "base.html" %}
{% block title %}{% if obj %}{{ t.edit_book }}{% else %}{{ t.new_book }}{% endif %}{% endblock %}
{% block content %}
<h1>{% if obj %}{{ t.edit_book }}{% else %}{{ t.new_book }}{% endif %}</h1>
<form method="post" action="{{ action }}" class="mt-3" style="max-width: 600px;">
    <div class="mb-3">
        <label class="form-label">{{ t.category }}</label>
        <select name="category" class="form-select" required>
            <option value="">{{ t.select_placeholder }}</option>
            {% for c in categories %}
            <option value="{{ c.id }}" {% if obj and obj.category.id == c.id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">{{ t.name }}</label>
        <input type="text" name="name" class="form-control" value="{{ obj.name if obj else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">{{ t.universe }} <span class="text-muted">(optional)</span></label>
        <input type="text" name="universe" class="form-control" value="{{ obj.universe if obj else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">{{ t.period }} <span class="text-muted">(optional)</span></label>
        <input type="text" name="period" class="form-control" value="{{ obj.period if obj else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">{{ t.location }}</label>
        <select name="location" class="form-select" required>
            <option value="">{{ t.select_placeholder }}</option>
            {% for loc in locations %}
            <option value="{{ loc.id }}" {% if obj and obj.location.id == loc.id %}selected{% endif %}>
                {{ loc.room }}{% if loc.spot %} – {{ loc.spot }}{% endif %}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">{{ t.save }}</button>
        <a href="{{ url_for('books.index') }}" class="btn btn-outline-secondary">{{ t.cancel }}</a>
    </div>
</form>
{% endblock %}
