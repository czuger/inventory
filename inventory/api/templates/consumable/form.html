{% extends "base.html" %}
{% block title %}{% if obj %}{{ t.edit_consumable }}{% else %}{{ t.new_consumable }}{% endif %}{% endblock %}
{% block content %}
<h1>{% if obj %}{{ t.edit_consumable }}{% else %}{{ t.new_consumable }}{% endif %}</h1>
<form method="post" action="{{ action }}" class="mt-3" style="max-width: 600px;">
    <div class="mb-3">
        <label class="form-label">{{ t.category }}</label>
        <select name="category" class="form-select" required>
            <option value="">{{ t.select_placeholder }}</option>
            {% for c in categories %}
            <option value="{{ c.id }}" {% if obj and obj.category.id == c.id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">{{ t.type }}</label>
        <input type="text" name="type" class="form-control" value="{{ obj.type if obj else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">{{ t.unit }} <span class="text-muted">(optional)</span></label>
        <input type="text" name="unit" class="form-control" value="{{ obj.unit if obj else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">{{ t.quantity }}</label>
        <input type="number" name="quantity" class="form-control" min="0" value="{{ obj.quantity if obj else 0 }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">{{ t.location }}</label>
        <select name="location" class="form-select" required>
            <option value="">{{ t.select_placeholder }}</option>
            {% for loc in locations %}
            <option value="{{ loc.id }}" {% if obj and obj.location.id == loc.id %}selected{% endif %}>
                {{ loc.room }}{% if loc.spot %} – {{ loc.spot }}{% endif %}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">{{ t.save }}</button>
        <a href="{{ url_for('consumables.index') }}" class="btn btn-outline-secondary">{{ t.cancel }}</a>
    </div>
</form>
{% endblock %}
