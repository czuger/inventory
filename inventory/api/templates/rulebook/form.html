{% extends "base.html" %}
{% block title %}{% if obj %}{{ t.edit_rulebook }}{% else %}{{ t.new_rulebook }}{% endif %}{% endblock %}
{% block content %}
<h1>{% if obj %}{{ t.edit_rulebook }}{% else %}{{ t.new_rulebook }}{% endif %}</h1>
<form method="post" action="{{ action }}" class="mt-3" style="max-width: 600px;">
    <div class="mb-3">
        <label class="form-label">{{ t.category }}</label>
        <select name="category" class="form-select" required>
            <option value="">{{ t.select_placeholder }}</option>
            {% for c in categories %}
            <option value="{{ c }}" {% if obj and obj.category == c %}selected{% endif %}>{{ t.categories[c] }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">{{ t.name }}</label>
        <input type="text" name="name" class="form-control" value="{{ obj.name if obj else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">{{ t.game }}</label>
        <select name="game" class="form-select" required>
            <option value="">{{ t.select_placeholder }}</option>
            {% for g in games %}
            <option value="{{ g.id }}" {% if obj and obj.game.id == g.id %}selected{% endif %}>{{ g.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" name="supplement" id="supplement" class="form-check-input"
               {% if obj and obj.supplement %}checked{% endif %}>
        <label class="form-check-label" for="supplement">{{ t.supplement }}</label>
    </div>
    <div class="mb-3">
        <label class="form-label">{{ t.quantity }}</label>
        <input type="number" name="quantity" class="form-control" min="0" value="{{ obj.quantity if obj else 1 }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">{{ t.location }}</label>
        <select name="location" class="form-select" required>
            <option value="">{{ t.select_placeholder }}</option>
            {% for loc in locations %}
            <option value="{{ loc.id }}" {% if obj and obj.location.id == loc.id %}selected{% endif %}>
                {{ loc.room }}{% if loc.spot %} – {{ loc.spot }}{% endif %}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">{{ t.save }}</button>
        <a href="{{ url_for('rulebooks.index') }}" class="btn btn-outline-secondary">{{ t.cancel }}</a>
    </div>
</form>
{% endblock %}
