{% extends "base.html" %}

{% block title %}Modifier {{ item.label }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3">Modifier — {{ item.label }}</h1>
  <a href="{{ url_for('show', id=item.id) }}" class="btn btn-outline-secondary">Annuler</a>
</div>

<form method="POST" enctype="multipart/form-data">

  <!-- General -->
  <div class="card mb-4">
    <div class="card-header fw-bold">Général</div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-2">
          <label class="form-label">Code</label>
          <input class="form-control" name="code" value="{{ item.code or '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Catégorie</label>
          <input class="form-control" name="categorie" value="{{ item.categorie or '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Sous-catégorie</label>
          <input class="form-control" name="sous_categorie" value="{{ item.sous_categorie or '' }}">
        </div>
        <div class="col-md-2">
          <label class="form-label">Échelle</label>
          <input class="form-control" name="echelle" value="{{ item.echelle or '' }}">
        </div>
        <div class="col-md-8">
          <label class="form-label">Label</label>
          <input class="form-control" name="label" value="{{ item.label or '' }}">
        </div>

        <div class="col-md-4">
          <label class="form-label">Tags <small class="text-muted">(séparés par virgule)</small></label>
          <input class="form-control" name="tags" value="{{ item.tags | join(', ') }}">
        </div>
                  <div class="col-md-12">
          <label for="media" class="form-label">Media</label>
          <input type="file" class="form-control" id="media" name="media"
            accept="image/*,video/*">
        </div>

        <div class="col-12">
          <label class="form-label">Remarques</label>
          <textarea class="form-control" name="remarques" rows="2">{{ item.remarques or '' }}</textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- Quantite -->
  <div class="card mb-4">
    <div class="card-header fw-bold">Quantité</div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Nombre</label>
          <input class="form-control" name="quantite_nombre" type="number" step="any"
            value="{{ item.quantite.nombre if item.quantite else '' }}">
        </div>
        <div class="col-md-3">
          <label class="form-label">Unité</label>
          <input class="form-control" name="quantite_unite"
            value="{{ item.quantite.unite if item.quantite else '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">Détails</label>
          <input class="form-control" name="quantite_details"
            value="{{ item.quantite.details if item.quantite else '' }}">
        </div>
      </div>
    </div>
  </div>

  <!-- Localisation -->
  <div class="card mb-4">
    <div class="card-header fw-bold">Localisation</div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Salle</label>
          <select class="form-select" name="salle">
            <option value="">--</option>
            {% for s in ["grande salle", "petite salle"] %}
            <option value="{{ s }}" {{ 'selected' if item.localisation and item.localisation.salle == s }}>{{ s }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-8">
          <label class="form-label">Emplacement</label>
          <select class="form-select" name="emplacement">
            <option value="">--</option>
            {% for e in ["placard 1 porte","placard 2 portes","pièce 1","vitrine 1","vitrine 2","pièce 2","armoire 1","armoire 2"] %}
            <option value="{{ e }}" {{ 'selected' if item.localisation and item.localisation.emplacement == e }}>{{ e }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Dimensions -->
  <div class="card mb-4">
    <div class="card-header fw-bold">Dimensions</div>
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-3">
          <label class="form-label">Largeur (pouces)</label>
          <input class="form-control" name="largeur_pouces" type="number" step="any"
            value="{{ item.dimensions.largeur_pouces if item.dimensions else '' }}">
        </div>
        <div class="col-md-3">
          <label class="form-label">Longueur (pouces)</label>
          <input class="form-control" name="longueur_pouces" type="number" step="any"
            value="{{ item.dimensions.longueur_pouces if item.dimensions else '' }}">
        </div>
        <div class="col-md-3">
          <label class="form-label">Largeur (cm)</label>
          <input class="form-control" name="largeur_cm" type="number" step="any"
            value="{{ item.dimensions.largeur_cm if item.dimensions else '' }}">
        </div>
        <div class="col-md-3">
          <label class="form-label">Longueur (cm)</label>
          <input class="form-control" name="longueur_cm" type="number" step="any"
            value="{{ item.dimensions.longueur_cm if item.dimensions else '' }}">
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex gap-2 mb-5">
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="{{ url_for('show', id=item.id) }}" class="btn btn-outline-secondary">Annuler</a>
  </div>

</form>
{% endblock %}
