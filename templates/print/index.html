{% extends "base.html" %}
{% block title %}{{ t.print }}{% endblock %}
{% block content %}
<h1>{{ t.print }}</h1>
<form method="post" class="mt-3">
    <div class="mb-3">
        <div class="btn-group" role="group">
            <input type="radio" class="btn-check" name="mode" id="mode_new" value="new"
                   autocomplete="off" {% if not selected %}checked{% endif %} onchange="toggleCategory()">
            <label class="btn btn-outline-secondary" for="mode_new">{{ t.print_mode_new }}</label>

            <input type="radio" class="btn-check" name="mode" id="mode_full" value="full"
                   autocomplete="off" onchange="toggleCategory()">
            <label class="btn btn-outline-secondary" for="mode_full">{{ t.print_mode_full }}</label>

            <input type="radio" class="btn-check" name="mode" id="mode_category" value="category"
                   autocomplete="off" {% if selected %}checked{% endif %} onchange="toggleCategory()">
            <label class="btn btn-outline-secondary" for="mode_category">{{ t.print_mode_category }}</label>
        </div>
    </div>
    <div class="mb-3" id="category-row" style="max-width:300px;{% if not selected %}display:none{% endif %}">
        <label class="form-label">{{ t.category }}</label>
        <select name="category" class="form-select">
            <option value="">— {{ t.all }} —</option>
            {% for cat in categories %}
            <option value="{{ cat }}" {% if cat == selected %}selected{% endif %}>
                {{ t.categories[cat] }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="d-flex gap-2">
        <button type="submit" formaction="{{ url_for('print_page.stickers') }}"
                class="btn btn-outline-secondary"><i class="bi bi-printer"></i> {{ t.print_stickers }}</button>
        <button type="submit" formaction="{{ url_for('print_page.print_list') }}"
                class="btn btn-outline-primary"><i class="bi bi-list-ul"></i> {{ t.print_list }}</button>
    </div>
</form>
<script>
function toggleCategory() {
    var mode = document.querySelector('input[name="mode"]:checked').value;
    document.getElementById('category-row').style.display = mode === 'category' ? '' : 'none';
}
</script>
{% endblock %}
