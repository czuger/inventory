{% extends "base.html" %}
{% block title %}{{ t.register }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <h1 class="h3 mb-3">{{ t.register }}</h1>
        {% if error %}<div class="alert alert-danger">{{ t[error] }}</div>{% endif %}
        <form method="post" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
                <label class="form-label" for="username">{{ t.username }}</label>
                <input type="text" name="username" id="username" class="form-control" value="{{ username }}"
                       autocomplete="username" autocapitalize="none" minlength="3" maxlength="32"
                       pattern="[A-Za-z0-9_.\-]+" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">{{ t.password }}</label>
                <input type="password" name="password" id="password" class="form-control"
                       autocomplete="new-password" minlength="8" maxlength="128" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password_confirm">{{ t.password_confirm }}</label>
                <input type="password" name="password_confirm" id="password_confirm" class="form-control"
                       autocomplete="new-password" minlength="8" maxlength="128" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">{{ t.register }}</button>
        </form>
        <p class="text-center small mt-3 mb-0">
            {{ t.have_account }} <a href="{{ url_for('auth.signin') }}">{{ t.login }}</a>
        </p>
    </div>
</div>
{% endblock %}
