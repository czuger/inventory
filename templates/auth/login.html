{% extends "base.html" %}
{% block title %}{{ t.login }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <h1 class="h3 mb-3">{{ t.login }}</h1>
        {% if error %}<div class="alert alert-danger">{{ t[error] }}</div>{% endif %}
        <form method="post" action="{{ url_for('auth.signin') }}">
            <div class="mb-3">
                <label class="form-label" for="username">{{ t.username }}</label>
                <input type="text" name="username" id="username" class="form-control" value="{{ username }}"
                       autocomplete="username" autocapitalize="none" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">{{ t.password }}</label>
                <input type="password" name="password" id="password" class="form-control"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">{{ t.login }}</button>
        </form>
        <div class="text-center text-muted small my-3">— {{ t.or }} —</div>
        <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary w-100">
            <i class="bi bi-discord"></i> {{ t.login_with_discord }}
        </a>
        <p class="text-center small mt-3 mb-0">
            {{ t.no_account }} <a href="{{ url_for('auth.register') }}">{{ t.register }}</a>
        </p>
    </div>
</div>
{% endblock %}
