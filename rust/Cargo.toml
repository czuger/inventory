[package]
name = "inventory"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
flate2 = "1.1.10"
form_urlencoded = "1.2.2"
getrandom = "0.4.3"
hmac = "0.13.0"
minijinja = { version = "2.24.0", features = ["loader"] }
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }
percent-encoding = "2.3.2"
qrcode = { version = "0.14.1", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "sqlx-toml"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
form_urlencoded = "1.2.2"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# No panics on request paths (or anywhere outside tests): errors go through AppError.
unwrap_used = "deny"
expect_used = "deny"
